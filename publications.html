<h2>导师</h2>
<div style="margin-bottom:20px;">

  <p>艾旭鹏</p >
  
<p>男，康复大学（青岛）生物医学工程专业智能机器人方向准聘副教授。哈尔滨工程大学船舶与海洋工程专业学士，美国哥伦比亚大学机械工程硕士、博士及博士后。

<p></p>主要研究方向为基于边界的按需辅助（BAAN）力场康复机器人，研究对象涵盖脊髓受损患者和脑瘫儿童等姿态控制缺陷人群。
</p >
